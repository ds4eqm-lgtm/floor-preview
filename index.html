<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리집 바닥 미리보기</title>
<meta name="description" content="우리집 사진을 올리면 데코타일이 깔린 모습을 바로 보여드려요">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 레이아웃: 위 사진 무대, 아래 제품 고르기 / 넓은 화면은 왼쪽 무대, 오른쪽 조작판 */
:root{
  --paper:#f5f4f0; --card:#ffffff; --ink:#1d211f; --muted:#69706b; --line:#e1dfd8;
  --accent:#2e5b4e; --accent-ink:#ffffff; --accent-soft:#e3ece8; --stage:#1a1b1a; --warn:#9a5b16;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141614; --card:#1d201e; --ink:#ecefec; --muted:#9aa29c; --line:#2d322f;
  --accent:#7fb8a5; --accent-ink:#0f1a16; --accent-soft:#22302b; --stage:#0c0d0c; --warn:#e2a35a; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#141614; --card:#1d201e; --ink:#ecefec; --muted:#9aa29c; --line:#2d322f;
  --accent:#7fb8a5; --accent-ink:#0f1a16; --accent-soft:#22302b; --stage:#0c0d0c; --warn:#e2a35a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:15px;color:var(--accent)}
h1{font-size:21px;letter-spacing:-.03em;margin:0;font-weight:750;text-wrap:balance}
.layout{display:grid;gap:16px}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:start}.side{position:sticky;top:14px}}
.stage{position:relative;background:var(--stage);border-radius:var(--r);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:260px}
#view{display:block;max-width:100%;max-height:68vh;width:auto;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage.drawing #view,.stage.comparing #view{touch-action:none;cursor:crosshair}
.stage.comparing #view{cursor:ew-resize}
.chip{position:absolute;left:10px;top:10px;background:rgba(15,17,16,.78);color:#f2f4f2;font-size:13px;padding:6px 11px;border-radius:999px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 20px)}
.dot{width:8px;height:8px;border-radius:50%;background:#8fd1b9;flex:none}
.chip.busy .dot{animation:pulse 1s ease-in-out infinite}
.chip.warn{background:rgba(104,50,4,.94)}
.chip.warn .dot{background:#f0b267}
.vh{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;padding:0;border:0;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.chip.busy .dot{animation:none}}
.split{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none}
.split::after{content:"";position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tag{position:absolute;bottom:10px;font-size:12px;color:#fff;background:rgba(0,0,0,.55);padding:3px 9px;border-radius:999px;pointer-events:none}
.tag.l{left:10px}.tag.r{right:10px}
.upload{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.upload:focus-within .btn{outline:2px solid var(--accent);outline-offset:2px}
button,.btn{font:inherit;border:0;cursor:pointer;border-radius:12px;padding:12px 14px;font-weight:650;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:46px}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
.side{display:grid;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.label{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;margin:0 0 10px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.sw{display:grid;grid-template-columns:minmax(0,1fr);justify-content:stretch;width:100%;align-content:start;gap:6px;padding:0;border:0;background:none;min-height:0;text-align:left;font-weight:500;font-size:12.5px;line-height:1.3;color:var(--ink);border-radius:10px}
.sw .img{display:block;width:100%;align-self:start;aspect-ratio:1;border-radius:10px;background-size:cover;background-position:center;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"] .img{border-color:var(--accent);box-shadow:0 0 0 2px var(--card) inset}
.sw[aria-pressed="true"]{background:none}
.layout>*,.side>*{min-width:0}
@media (max-width:899px){
  #view{max-height:56vh}
  .swatches{position:relative;display:flex;overflow-x:auto;gap:10px;margin-inline:-14px;padding:0 14px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .sw{flex:0 0 74px;width:74px;scroll-snap-align:start}
}
.info{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.info .name{font-weight:750;font-size:17px;letter-spacing:-.02em}
.info .spec{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tools button{flex-direction:column;gap:3px;font-size:12.5px;padding:10px 4px;min-height:62px;font-weight:600}
.tools svg{width:22px;height:22px}
.row{display:grid;gap:6px;margin-top:12px}
.row label{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}
.row output{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.bar>*{flex:1 1 0}
.note{font-size:12.5px;color:var(--muted);margin-top:4px}
.err{color:var(--warn)}
/* 조명 색온도: 막대 색은 실제 그 색온도 빛 색으로 채움 (스크립트가 --ct-grad 를 넣음) */
.ct-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.ct-head .label{margin:0}
#ctOut{font-weight:750;font-size:16px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
#ctOut small{font-size:12.5px;font-weight:500;color:var(--muted);margin-left:6px}
#ctRange{-webkit-appearance:none;appearance:none;display:block;height:32px;margin:2px 0 0;background:transparent;cursor:pointer}
#ctRange::-webkit-slider-runnable-track{height:10px;border-radius:999px;background:var(--ct-grad,linear-gradient(90deg,#ffb067,#fff3e4,#cfe0ff));box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
#ctRange::-moz-range-track{height:10px;border-radius:999px;background:var(--ct-grad,linear-gradient(90deg,#ffb067,#fff3e4,#cfe0ff));box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
#ctRange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 1px 5px rgba(0,0,0,.3)}
#ctRange::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 1px 5px rgba(0,0,0,.3)}
#ctRange:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.ct-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:2px}
.ct-presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.ct-presets button{flex-direction:column;gap:1px;min-height:50px;padding:6px 2px;font-size:13px;font-weight:650;line-height:1.2}
.ct-presets .k{font-size:11.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
/* 최근 올린 사진 (이 기기 안에만 저장) */
.recent{margin-top:6px}
.recent-head{display:flex;align-items:center;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;margin-bottom:6px}
.recent-head .label{margin:0}
.recent-head .sub{font-weight:500;margin-left:6px;letter-spacing:0}
.linkbtn{background:none;border:0;min-height:32px;padding:4px 2px;font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.linkbtn.armed{color:var(--warn)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-inline:-2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.th{position:relative;flex:0 0 72px;width:72px;height:72px;scroll-snap-align:start}
.th-open{width:100%;height:100%;padding:0;min-height:0;border-radius:10px;overflow:hidden;border:2px solid transparent;background:var(--line)}
.th-open img{display:block;width:100%;height:100%;object-fit:cover}
.th-open[aria-pressed="true"]{border-color:var(--accent);background:var(--line);box-shadow:0 0 0 2px var(--paper) inset}
.th-del{position:absolute;top:2px;right:2px;width:28px;height:28px;min-height:0;padding:0;border:0;background:none;color:#fff;font-size:13px;font-weight:700;line-height:1}
.th-del::before{content:"";position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(18,20,19,.62)}
.th-del span{position:relative}
@media (hover:hover){.th-del{opacity:.75}.th:hover .th-del{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand" id="brand">새로고침</span>
    <h1>우리집 바닥 미리보기</h1>
  </header>

  <div class="layout">
    <section>
      <div class="stage" id="stage">
        <canvas id="view" width="10" height="10" aria-label="바닥 미리보기 화면"></canvas>
        <div class="chip" id="chip" role="status"><span class="dot"></span><span id="chipText">준비 중이에요</span></div>
        <div class="split" id="split" hidden></div>
        <span class="tag l" id="tagL" hidden>지금 바닥</span>
        <span class="tag r" id="tagR" hidden>시공 후</span>
      </div>
      <div class="upload">
        <label class="btn primary" for="fileCam">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          사진 찍기
        </label>
        <label class="btn" for="fileAlbum">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>
          앨범에서 고르기
        </label>
        <input id="fileCam" class="vh" type="file" accept="image/*" capture="environment">
        <input id="fileAlbum" class="vh" type="file" accept="image/*,.heic,.heif">
      </div>
      <p class="note">서서 바닥이 넓게 보이게 찍어 주세요. 천장 모서리나 방문 윗부분이 같이 나오면 타일 크기가 더 정확해져요. 사진은 휴대폰 안에서만 처리되고 어디에도 올라가지 않아요.</p>
      <div class="recent" id="recent" hidden>
        <div class="recent-head">
          <p class="label">최근 올린 사진<span class="sub">이 기기에만 20장까지 저장돼요</span></p>
          <button class="linkbtn" id="rClear" type="button">모두 지우기</button>
        </div>
        <div class="thumbs" id="thumbs" role="list" aria-label="최근 올린 사진"></div>
      </div>
    </section>

    <aside class="side">
      <div class="panel">
        <p class="label">색상 고르기</p>
        <div class="swatches" id="swatches"></div>
      </div>

      <div class="panel info" id="info">
        <div>
          <div class="name" id="pName"></div>
          <div class="spec" id="pSpec"></div>
        </div>
        <a class="btn primary" id="pLink" href="#" target="_blank" rel="noopener" hidden>제품 보러 가기</a>
      </div>

      <div class="tools">
        <button id="tCompare" aria-pressed="false" title="지금 바닥과 비교">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>비교</button>
        <button id="tRotate" title="타일 방향 바꾸기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>방향</button>
        <button id="tBrush" aria-pressed="false" title="바닥 범위 고치기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 4l6 6-9 9H5v-6z"/><path d="M12 6l6 6"/></svg>바닥 고치기</button>
      </div>

      <div class="panel" id="brushPanel" hidden>
        <p class="label">손가락으로 바닥 범위 고치기</p>
        <div class="seg">
          <button id="bAdd" aria-pressed="true">바닥 칠하기</button>
          <button id="bErase" aria-pressed="false">지우기</button>
        </div>
        <div class="row">
          <label for="bSize">붓 크기 <output id="bSizeOut"></output></label>
          <input id="bSize" type="range" min="10" max="160" value="60">
        </div>
        <div class="bar">
          <button id="bUndo">되돌리기</button>
          <button id="bDone" class="primary">다 했어요</button>
        </div>
        <p class="hint">파랗게 보이는 곳에만 타일이 깔려요. 가구나 벽에 묻었으면 지우고, 빠진 바닥은 칠해 주세요.</p>
      </div>

      <div class="panel" id="ctPanel">
        <div class="ct-head">
          <label class="label" for="ctRange">조명 색온도</label>
          <output id="ctOut" for="ctRange"></output>
        </div>
        <input id="ctRange" type="range" min="2500" max="7500" step="100" value="5500">
        <div class="ct-ends" aria-hidden="true"><span>노란 빛</span><span>하얀 빛</span><span>푸른 빛</span></div>
        <div class="ct-presets" role="group" aria-label="조명 색 고르기">
          <button type="button" data-k="3000" aria-pressed="false"><span class="n">전구색</span><span class="k">3000K</span></button>
          <button type="button" data-k="4000" aria-pressed="false"><span class="n">주백색</span><span class="k">4000K</span></button>
          <button type="button" data-k="6500" aria-pressed="false"><span class="n">주광색</span><span class="k">6500K</span></button>
          <button type="button" data-k="" aria-pressed="true"><span class="n">사진 그대로</span><span class="k" id="ctAutoK">자동</span></button>
        </div>
      </div>

      <button class="primary" id="tSave" style="width:100%">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        결과 사진 저장하기
      </button>
      <p class="note" id="gpuNote"></p>
    </aside>
  </div>
</div>

<!-- products.js, refine.js, orient.js, camera.js 를 고치면 아래 v= 값과 VERSION 값을 같이 올려야 손님 폰에 바로 반영됨 -->
<script src="products.js?v=2026.11.03c"></script>
<script src="refine.js?v=2026.11.03c"></script>
<script src="orient.js?v=2026.11.03c"></script>
<script src="camera.js?v=2026.11.03c"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const PRODUCTS=window.PRODUCTS||[];
const SHOP=window.SHOP||{name:"",tagline:""};
const params=new URLSearchParams(location.search);
const MAX_SIDE=1600;
const MODELS=["Xenova/segformer-b1-finetuned-ade-512-512","Xenova/segformer-b0-finetuned-ade-512-512"];
const TF_URL="https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2";
/* 러그는 바닥이 아니라 바닥 위 물건으로 봄 (새 바닥을 깔아도 러그는 그대로 남게) */
const FLOORISH=new Set(["floor","flooring"]);
/* 창문, 문, 바깥 풍경: 이 둘레에 떨어져 있는 바닥 조각은 베란다나 창밖으로 봄 */
const OPENING=new Set(["windowpane","door","screen door","curtain","blind","railing","bannister","fence","sky","building","skyscraper","house","tree","mountain","hill","palm"]);
const HEIC_URL="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";
const VERSION="2026.11.03c";
const bust=u=>u+(u.indexOf("?")<0?"?":"&")+"v="+VERSION;
const PICK_KEY="floorPickAt";

if(SHOP.name) $("brand").textContent=SHOP.name;
$("gpuNote").textContent="버전 "+VERSION;
window.addEventListener("error",e=>{
  if(!e||!e.filename||e.filename.indexOf(location.origin)!==0)return;
  chip("오류가 났어요: "+((e&&e.message)||"알 수 없음"),"warn");
});

const S={
  W:0,H:0,photoCanvas:null,maskCanvas:null,maskCtx:null,
  product:null,tileReady:false,
  pitch:24,autoPitch:24,roll:0,autoRoll:0,fov:0,scale:1,rot:90,autoRot:90,rotStep:0,shade:.85,bright:1,expo:[1,1,1],noise:0,
  split:-1,compare:false,brush:false,brushAdd:true,brushSize:60,grid:false,
  /* 축척: 카메라 높이(mm), 화각 보정(fov), AI가 본 천장, 벽, 문 확률 지도 */
  camH:1400,camInfo:"",sem:null,
  /* 조명 색온도: 사진에서 짐작한 값, 손님이 고른 값(null 이면 사진 그대로), 사진 전체에 곱할 색 */
  cctEst:null,cctSet:null,wb:[1,1,1],
  undo:[],aiBusy:false,aiTok:0,
  /* 사진을 새로 띄울 때마다 1씩 올라가는 번호: 늦게 끝난 예전 작업이 지금 사진을 덮어쓰지 못하게 */
  loadToken:0,histId:null
};
function newLoad(){S.loadToken++;return S.loadToken;}

/* ---------- 상태 표시 ---------- */
function chip(text,kind){
  $("chipText").textContent=text;
  const c=$("chip");c.classList.toggle("busy",kind==="busy");c.classList.toggle("warn",kind==="warn");
  c.hidden=!text;
}

/* ---------- WebGL ---------- */
const view=$("view");
const gl=view.getContext("webgl2",{preserveDrawingBuffer:true,antialias:false,premultipliedAlpha:false});
if(!gl){chip("이 브라우저에서는 미리보기를 쓸 수 없어요. 크롬이나 사파리 최신 버전으로 열어 주세요","warn");}

const VS=`#version 300 es
in vec2 p;out vec2 vUv;
void main(){vUv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}`;
const FS=`#version 300 es
precision highp float;
precision highp sampler2DArray;
uniform sampler2D uPhoto,uMask,uShade,uAO;
/* 데코타일 무늬: 서로 다른 무늬 여러 장(보통 4장)을 겹겹이 넣어 두고 타일마다 아무거나 하나씩 */
uniform sampler2DArray uTile;
uniform float uLayers;
uniform vec3 uExpo,uWB;
uniform float uNoise;
uniform vec2 uSize,uMaskTexel,uTileMM;
uniform vec3 uH0,uH1,uH2;
uniform int uPattern;
uniform float uRot,uShadeAmt,uSplit,uMaskView,uGrid,uHasTile;
in vec2 vUv;out vec4 o;
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float h1(float x){return fract(sin(x*91.345+3.17)*47453.123);}
void main(){
  vec2 uv=vUv;
  vec3 photo=texture(uPhoto,uv).rgb;
  float m=0.;
  for(int i=-1;i<=1;i++)for(int j=-1;j<=1;j++)m+=texture(uMask,uv+vec2(float(i),float(j))*uMaskTexel).r;
  m/=9.;
  vec3 col=photo;
  vec3 hp=vec3(uv*uSize,1.);
  float den=dot(uH2,hp);
  float gridLine=0.;
  if(den>1e-6&&uHasTile>.5){
    vec2 P=vec2(dot(uH0,hp),dot(uH1,hp))/den;
    float c=cos(uRot),s=sin(uRot);
    P=vec2(c*P.x+s*P.y,-s*P.x+c*P.y);
    vec2 sz=uTileMM;
    float row=floor(P.y/sz.y);
    float off=uPattern==1?h1(row)*sz.x:(uPattern==2?mod(row,2.)*.5*sz.x:0.);
    vec2 cf=vec2(P.x+off,P.y)/sz;
    vec2 cell=floor(cf);

    vec2 tuv=r1>.5?1.-lc:lc;
    /* 이 타일이 쓸 무늬: 4장 중 하나를 칸마다 무작위로 (반 바퀴 돌림과 따로 섞어 8가지 모습) */
    float layer=min(floor(h2(cell*vec2(1.731,2.417)+vec2(5.3,1.7))*uLayers),uLayers-1.);
    /* 폰 카메라로 찍은 것처럼 아주 살짝 덜 또렷하게 (제품 원본 사진의 칼같은 선명함은 CG처럼 보임) */
    vec3 t=textureGrad(uTile,vec3(tuv,layer),dFdx(cf)*1.25,dFdy(cf)*1.25).rgb;
    vec2 dmm=min(lc,1.-lc)*sz;

    float d=min(dmm.x,dmm.y);
    float jw=.5;
    float jl=1.-smoothstep(jw-fw*.6,jw+fw*.6,d);
    t*=1.-jl*clamp(1.-fw/6.,0.,1.)*.14;
    /* 제품 사진 밝기 그대로가 아니라, 이 방 빛과 사진 노출 아래에서 보일 밝기로 (빛 계산은 선형 밝기에서) */
    vec3 lin=pow(max(t,vec3(0.)),vec3(2.2));
    float sh=texture(uShade,uv).r*2.;
    float ao=texture(uAO,uv).r;
    lin*=uExpo*mix(1.,sh*ao,uShadeAmt);
    vec3 srgb=pow(max(lin,vec3(0.)),vec3(1./2.2));
    /* 사진과 같은 정도의 자글자글한 노이즈 (매끈한 CG 느낌 없애기) */
    vec2 fc=gl_FragCoord.xy;

    vec3 gc=vec3(h2(fc+vec2(11.,5.)),h2(fc+vec2(2.,19.)),h2(fc+vec2(7.,3.)))-.5;
    srgb+=uNoise*(vec3(g0*2.45)+gc*.5);

      gridLine=(1.-clamp(min(gd.x,gd.y)-.5,0.,1.))*clamp(1.-max(fwidth(g).x,fwidth(g).y)*6.,0.,1.);

  col=pow(max(pow(max(col,vec3(0.)),vec3(2.2))*uWB,vec3(0.)),vec3(1./2.2));
  if(uMaskView>0.)col=mix(col,vec3(.18,.52,1.),m*.38*uMaskView);

let prog,U={},TEX={};
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function initGL(){

  gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  ["uPhoto","uMask","uShade","uTile","uAO","uExpo","uWB","uNoise","uSize","uMaskTexel","uTileMM","uLayers","uH0","uH1","uH2","uPattern","uRot","uShadeAmt","uSplit","uMaskView","uGrid","uHasTile"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
  TEXN.forEach((n,i)=>{TEX[n]=gl.createTexture();gl.uniform1i(U[n==="ao"?"uAO":"u"+n[0].toUpperCase()+n.slice(1)],i);});
  const one=document.createElement("canvas");one.width=one.height=1;const ox=one.getContext("2d");ox.fillStyle="#fff";ox.fillRect(0,0,1,1);
  upload("ao",one,false);
  const an=gl.getExtension("EXT_texture_filter_anisotropic");TEX.aniso=an;
  /* 제품 무늬가 오기 전에도 비어 있지 않게 흰 점 한 장 */
  const keepN=S.tileLayersN;uploadTileLayers([one]);S.tileLayersN=keepN||1;
}
const TEXN=["photo","mask","shade","tile","ao"];
function upload(name,src,mip){
  const unit=TEXN.indexOf(name);
  gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,TEX[name]);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  if(mip){gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
    if(TEX.aniso)gl.texParameterf(gl.TEXTURE_2D,TEX.aniso.TEXTURE_MAX_ANISOTROPY_EXT,Math.min(8,gl.getParameter(TEX.aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));}
  else gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
}

/* 데코타일 무늬 여러 장을 한 텍스처 배열로 (장마다 따로 축소본을 만들어 이웃 무늬가 번지지 않음) */
function uploadTileLayers(layers){
  const unit=TEXN.indexOf("tile"),w=layers[0].width,h=layers[0].height,n=layers.length,T=gl.TEXTURE_2D_ARRAY;
  gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(T,TEX.tile);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage3D(T,0,gl.RGBA8,w,h,n,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  layers.forEach((c,i)=>gl.texSubImage3D(T,0,0,0,i,w,h,1,gl.RGBA,gl.UNSIGNED_BYTE,c));
  gl.texParameteri(T,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(T,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(T,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.generateMipmap(T);gl.texParameteri(T,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  if(TEX.aniso)gl.texParameterf(T,TEX.aniso.TEXTURE_MAX_ANISOTROPY_EXT,Math.min(8,gl.getParameter(TEX.aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  S.tileLayersN=n;
}

/* 사진 좌표를 바닥 평면 좌표(mm)로 바꾸는 행렬: 카메라 높이(천장, 문으로 잰 값, 없으면 1.4m), 기울기, 수평, 화각(사진 촬영 정보)으로 계산 */
function focal(){return Math.max(S.W,S.H)*0.728*Math.pow(2,S.fov/100);}
function homography(){
  const W=S.W,H=S.H,cx=W/2,cy=H/2,f=focal();
  const th=S.pitch*Math.PI/180,ct=Math.cos(th),st=Math.sin(th);
  const r=S.roll*Math.PI/180,cr=Math.cos(r),sr=Math.sin(r);
  const hc=S.camH||1400;
  const U0=[cr,-sr,-cr*cx+sr*cy];
  const V0=[sr,cr,-sr*cx-cr*cy];
  const R0=U0.map(x=>x*hc/f);
  const R1=V0.map(x=>-x*hc*st/f);R1[2]+=hc*ct;
  const R2=V0.map(x=>x*ct/f);R2[2]+=st;
  return [R0,R1,R2];
}

let raf=0;
function render(){if(!raf)raf=requestAnimationFrame(draw);}
function draw(){
  raf=0;if(!gl||!S.W||gl.isContextLost())return;
  gl.viewport(0,0,S.W,S.H);
  const [R0,R1,R2]=homography();
  gl.uniform3fv(U.uH0,R0);gl.uniform3fv(U.uH1,R1);gl.uniform3fv(U.uH2,R2);
  gl.uniform2f(U.uSize,S.W,S.H);
  gl.uniform2f(U.uMaskTexel,1/S.W,1/S.H);
  const p=S.product||{width:920,height:152,pattern:"stagger"};
  gl.uniform2f(U.uTileMM,+p.width||600,+p.height||600);
  gl.uniform1f(U.uLayers,S.tileLayersN||1);
  gl.uniform1i(U.uPattern,p.pattern==="stagger"?1:p.pattern==="half"?2:0);
  gl.uniform1f(U.uRot,S.rot*Math.PI/180);
  gl.uniform1f(U.uShadeAmt,S.shade);
  const ex=S.expo||[1,1,1],bk=S.bright||1;
  gl.uniform3f(U.uExpo,ex[0]*bk,ex[1]*bk,ex[2]*bk);
  gl.uniform1f(U.uNoise,S.noise||0);
  gl.uniform1f(U.uSplit,S.compare?S.split:-1);
  gl.uniform1f(U.uMaskView,S.brush?1:0);
  gl.uniform1f(U.uGrid,S.grid?1:0);
  const wb=S.wb||[1,1,1];gl.uniform3f(U.uWB,wb[0],wb[1],wb[2]);
  gl.uniform1f(U.uHasTile,S.tileReady?1:0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

/* ---------- 사진, 바닥 범위, 그림자 ---------- */
function setPhoto(img,skipLight){
  let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
  const k=Math.min(1,MAX_SIDE/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement("canvas");c.width=w;c.height=h;
  /* 사진 캔버스는 CPU 쪽에 둠: 밝기, 바닥 찾기에서 여러 번 읽는데 그래픽 칩에서 매번 꺼내 오면 느림 */
  const x=c.getContext("2d",{willReadFrequently:true});x.imageSmoothingQuality="high";x.drawImage(img,0,0,w,h);
  S.photoCanvas=c;S.photoPx=null;S.W=w;S.H=h;view.width=w;view.height=h;
  /* 새 사진: 화각, 카메라 높이, AI 지도는 이 사진 기준으로 다시 */
  S.fov=0;S.lensInfo="";S.camH=1400;S.camInfo="";S.sem=null;
  S.maskCanvas=document.createElement("canvas");S.maskCanvas.width=w;S.maskCanvas.height=h;
  S.maskCtx=S.maskCanvas.getContext("2d",{willReadFrequently:true});
  S.maskCtx.fillStyle="#000";S.maskCtx.fillRect(0,0,w,h);
  S.undo=[];
  upload("photo",c,false);uploadMask();if(!skipLight)computeLighting();
  if(S.compare)updateSplitUI();
  render();
}
function uploadMask(){upload("mask",S.maskCanvas,false);}
function setMask(src){
  const x=S.maskCtx;x.save();x.fillStyle="#000";x.fillRect(0,0,S.W,S.H);
  x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";x.drawImage(src,0,0,S.W,S.H);x.restore();
  uploadMask();
}
function fallbackMask(){
  const x=S.maskCtx;x.fillStyle="#000";x.fillRect(0,0,S.W,S.H);
  x.fillStyle="#fff";x.fillRect(0,Math.round(S.H*.5),S.W,S.H);uploadMask();
}
function shrink(src,w,h){
  let c=src,cw=src.width,ch=src.height;
  while(cw/2>w){const n=document.createElement("canvas");n.width=Math.round(cw/2);n.height=Math.round(ch/2);
    n.getContext("2d",{willReadFrequently:true}).drawImage(c,0,0,n.width,n.height);c=n;cw=n.width;ch=n.height;}
  const n=document.createElement("canvas");n.width=w;n.height=h;
  const x=n.getContext("2d",{willReadFrequently:true});x.imageSmoothingQuality="high";x.drawImage(c,0,0,w,h);return x.getImageData(0,0,w,h).data;
}
function boxBlur(a,w,h,r){

  for(let y=0;y<h;y++){for(let x=0;x<w;x++){let s=0,n=0;for(let k=-r;k<=r;k++){const xx=x+k;if(xx>=0&&xx<w){s+=a[y*w+xx];n++;}}t[y*w+x]=s/n;}}
  for(let y=0;y<h;y++){for(let x=0;x<w;x++){let s=0,n=0;for(let k=-r;k<=r;k++){const yy=y+k;if(yy>=0&&yy<h){s+=t[yy*w+x];n++;}}o[y*w+x]=s/n;}}

const LIN=new Float32Array(256);for(let i=0;i<256;i++)LIN[i]=Math.pow(i/255,2.2);
/* 빛 처리: 실제로 찍은 사진처럼 보이게
   1 원래 바닥에 찍힌 밝기 흐름(창가 밝음, 구석 어두움)을 선형 밝기 비율로 뽑아 바닥 전체에 입힘
   2 사진 노출은 벽, 천장처럼 밝고 무채색인 면을 흰색 기준으로 삼아 맞춤 (흰 벽보다 흰 타일이 더 밝게 뜨지 않게)
   3 조명 색(노란 전등, 흰 형광등)을 벽 색에서 읽어 타일에 살짝 입힘
   4 사진 자체의 자글자글한 노이즈 정도를 재서 타일에도 똑같이
   5 벽 밑, 가구 밑, 문짝 밑에 닿는 곳은 살짝 어둡게 (접지 그림자) */
function computeLighting(){
  const sw=Math.max(24,Math.round(S.W/14)),shh=Math.max(24,Math.round(S.H*sw/S.W));
  const pd=shrink(S.photoCanvas,sw,shh),md=shrink(S.maskCanvas,sw,shh);
  const n=sw*shh,L=new Float32Array(n),M=new Float32Array(n),vals=[];
  for(let i=0;i<n;i++){
    L[i]=.2126*LIN[pd[i*4]]+.7152*LIN[pd[i*4+1]]+.0722*LIN[pd[i*4+2]];
    if(md[i*4]>247){M[i]=1;vals.push(L[i]);}
  }

  const x=c.getContext("2d"),id=x.createImageData(sw,shh);

    s=Math.max(.3,Math.min(1.4,s));

    id.data[i*4]=v;id.data[i*4+1]=v;id.data[i*4+2]=v;id.data[i*4+3]=255;
  }

  const k=Math.min(1,256/Math.max(S.W,S.H)),rw=Math.max(8,Math.round(S.W*k)),rh=Math.max(8,Math.round(S.H*k));
  const rp=shrink(S.photoCanvas,rw,rh),rm=shrink(S.maskCanvas,rw,rh),refs=[];
  for(let i=0;i<rw*rh;i++){

  }
  let expo=1,cast=[1,1,1],how="기본",cct=null;
  if(refs.length>=60){
    refs.sort((a,b)=>a[0]-b[0]);
    /* 벽 밝기 분포의 80퍼센트 지점을 흰 벽(반사율 0.8)으로 보고, 바닥은 그보다 조금 덜 받는 빛(0.85배)으로 맞춤 */
    const dbg=params.get("debug")==="1";
    const qp=dbg&&params.get("lq")?+params.get("lq"):.8,kf=dbg&&params.get("lk")?+params.get("lk"):.85;
    const Lw=refs[Math.min(refs.length-1,Math.floor(refs.length*qp))][0];
    expo=Lw/.8*kf;how="벽 기준";
    let sr=0,sg=0,sb=0,sl=0;
    for(let j=Math.floor(refs.length*.55);j<refs.length;j++){sr+=refs[j][1];sg+=refs[j][2];sb+=refs[j][3];sl+=refs[j][0];}
    if(sl>0){
      const cc=[sr/sl,sg/sl,sb/sl],sat=Math.max(...cc)-Math.min(...cc);
      const st=.55*(1-Math.min(1,Math.max(0,(sat-.08)/.2)));
      cast=cc.map(v=>Math.max(.88,Math.min(1.12,1+(v-1)*st)));
      /* 밝은 벽 색으로 사진 속 조명 색온도 짐작 (벽지 자체 색도 섞여 있어서 대략값) */
      cct=rgbCCT(cc[0],cc[1],cc[2]);
    }
  }else if(floorMed){expo=floorMed/.3;how="바닥 기준";}
  /* 원래 바닥이 아주 밝은 색(반사율 0.75)부터 아주 어두운 색(0.06) 사이라는 점으로 노출 범위를 묶음 */
  if(floorMed)expo=Math.max(floorMed/.75,Math.min(floorMed/.06,expo));
  expo=Math.max(.15,Math.min(1.25,expo));
  const cl=.2126*cast[0]+.7152*cast[1]+.0722*cast[2];
  S.expo=cast.map(v=>v/cl*expo);
  S.noise=estimateNoise();
  S.aoCanvas=computeAO();upload("ao",S.aoCanvas,false);
  S.cctEst=cct&&Number.isFinite(cct)?Math.max(2000,Math.min(12000,cct)):null;
  updateWB();
  S.lightInfo="노출 "+expo.toFixed(2)+"("+how+") 조명색 "+cast.map(v=>v.toFixed(2)).join("/")+" 색온도 약 "+(S.cctEst?Math.round(S.cctEst):"모름")+"K 노이즈 "+S.noise.toFixed(4);
}
/* ---------- 조명 색온도 ----------
   색온도(K) → 그 빛의 색: 플랑크 궤적 근사식(Kim 2002) → XYZ → 선형 sRGB, 밝기 1로 맞춤 */
function cctRGB(T){
  T=Math.max(1667,Math.min(25000,T));
  const T2=T*T,T3=T2*T;
  const x=T<=4000?-0.2661239e9/T3-0.2343589e6/T2+0.8776956e3/T+0.179910:-3.0258469e9/T3+2.1070379e6/T2+0.2226347e3/T+0.240390;
  const x2=x*x,x3=x2*x;
  const y=T<=2222?-1.1063814*x3-1.34811020*x2+2.18555832*x-0.20219683:T<=4000?-0.9549476*x3-1.37418593*x2+2.09137015*x-0.16748867:3.0817580*x3-5.87338670*x2+3.75112997*x-0.37001483;
  const X=x/y,Z=(1-x-y)/y;
  return [3.2404542*X-1.5371385-0.4985314*Z,-0.9692660*X+1.8760108+0.0415560*Z,0.0556434*X-0.2040259+1.0572252*Z].map(v=>Math.max(1e-4,v));
}
/* 선형 sRGB 색 → 색온도(K): McCamy 근사식 */
function rgbCCT(r,g,b){
  const X=.4124564*r+.3575761*g+.1804375*b,Y=.2126729*r+.7151522*g+.0721750*b,Z=.0193339*r+.1191920*g+.9503041*b,t=X+Y+Z;
  if(!(t>0))return null;

}
/* 고른 색온도와 사진 속 색온도의 빛 색 차이만큼 사진 전체에 곱함
   폰 카메라가 빛 색을 어느 정도 알아서 보정하는 것처럼 차이의 일부(WB_K)만 반영 */
const CT_MIN=2500,CT_MAX=7500,WB_K=.55;
function updateWB(){
  const est=S.cctEst||5500;
  if(S.cctSet==null){S.wb=[1,1,1];}
  else{
    const a=cctRGB(S.cctSet),b=cctRGB(est);
    const m=a.map((v,i)=>Math.pow(v/b[i],WB_K)),l=.2126*m[0]+.7152*m[1]+.0722*m[2];
    S.wb=m.map(v=>v/l);
  }

}
function ctName(k){return {3000:"전구색",4000:"주백색",6500:"주광색"}[k]||"";}
function ctUI(){

  const sm=document.createElement("small");sm.textContent=S.cctSet==null?"사진 그대로":ctName(k);

/* 사진 노이즈: 바닥이 아닌 평평한 면(벽)에서 작은 칸마다 주변 평균과의 차이를 재고, 아래쪽 30퍼센트 값을 씀 */
function estimateNoise(){
  try{
    const W=S.W,H=S.H;
    /* 사진 픽셀은 사진이 바뀔 때만 한 번 읽어 둠 */
    if(!S.photoPx)S.photoPx=S.photoCanvas.getContext("2d").getImageData(0,0,W,H).data;
    const d=S.photoPx;
    const m=S.maskCanvas.getContext("2d").getImageData(0,0,W,H).data;
    const vals=[],lv=new Float32Array(64),sx=Math.max(8,Math.floor(W/32)),sy=Math.max(8,Math.floor(H/40));
    for(let by=8;by<H-16;by+=sy)for(let bx=8;bx<W-16;bx+=sx){
      if(m[((by+4)*W+bx+4)*4]>25)continue;
      let mean=0;
      for(let yy=0;yy<8;yy++)for(let xx=0;xx<8;xx++){const i=((by+yy)*W+bx+xx)*4;const l=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255;lv[yy*8+xx]=l;mean+=l;}
      mean/=64;if(mean<.15||mean>.95)continue;
      let rs=0,rc=0;
      for(let yy=1;yy<7;yy++)for(let xx=1;xx<7;xx++){let a=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)a+=lv[(yy+dy)*8+xx+dx];const r=lv[yy*8+xx]-a/9;rs+=r*r;rc++;}
      vals.push(Math.sqrt(rs/rc)*1.06);
    }
    if(vals.length<20)return .004;
    vals.sort((a,b)=>a-b);
    return Math.max(.002,Math.min(.03,vals[Math.floor(vals.length*.3)]));
  }catch(e){return .004;}
}
/* 접지 그림자: 바닥이 아닌 것(벽, 가구, 문짝)에서 가까운 바닥일수록 살짝 어둡게. 사진 테두리는 벽이 아니라서 제외 */
function computeAO(){
  const k=Math.min(1,400/Math.max(S.W,S.H)),w=Math.max(8,Math.round(S.W*k)),h=Math.max(8,Math.round(S.H*k));
  const md=shrink(S.maskCanvas,w,h),n=w*h,INF=1e9,d=new Float32Array(n);
  let any=false,fl=false;
  for(let i=0;i<n;i++){const f=md[i*4]>127;d[i]=f?INF:0;if(f)fl=true;else any=true;}
  if(any&&fl){
    const A=1,B=1.4142;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;let v=d[i];if(!v)continue;
      if(x>0)v=Math.min(v,d[i-1]+A);if(y>0){v=Math.min(v,d[i-w]+A);if(x>0)v=Math.min(v,d[i-w-1]+B);if(x<w-1)v=Math.min(v,d[i-w+1]+B);}d[i]=v;}
    for(let y=h-1;y>=0;y--)for(let x=w-1;x>=0;x--){const i=y*w+x;let v=d[i];if(!v)continue;
      if(x<w-1)v=Math.min(v,d[i+1]+A);if(y<h-1){v=Math.min(v,d[i+w]+A);if(x<w-1)v=Math.min(v,d[i+w+1]+B);if(x>0)v=Math.min(v,d[i+w-1]+B);}d[i]=v;}
  }
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d"),id=x.createImageData(w,h);
  const d0=Math.max(2,.012*Math.max(w,h)),A=.22;
  for(let i=0;i<n;i++){const v=d[i]>=INF?1:1-A*Math.exp(-d[i]/d0);const q=Math.round(v*255);id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=q;id.data[i*4+3]=255;}
  x.putImageData(id,0,0);return c;
}
/* 바닥 윗선 위치로 카메라 기울기 추정 */
function estimatePitch(){
  const sw=Math.min(200,S.W),shh=Math.round(S.H*sw/S.W);
  const md=shrink(S.maskCanvas,sw,shh);
  let top=-1,area=0;
  for(let y=0;y<shh;y++){let c=0;for(let x=0;x<sw;x++)c+=md[(y*sw+x)*4]>127?1:0;area+=c;if(top<0&&c>sw*.08)top=y;}
  if(top<0||area<sw*shh*.03)return null;
  const f=focal(),cy=S.H/2,topY=top/shh*S.H;
  const horizon=topY-f*Math.tan(18*Math.PI/180);
  const th=Math.atan((cy-horizon)/f)*180/Math.PI;
  return Math.max(6,Math.min(72,th));
}

/* ---------- 바닥 자동 인식 ---------- */
let segP=null,segName="",TFMOD=null;
function ensureModel(){
  if(segP)return segP;
  segP=(async()=>{
    const tf=await import(TF_URL);
    TFMOD=tf;
    tf.env.allowLocalModels=false;
    const files={};
    const cb=e=>{
      if(e&&e.status==="progress"&&e.total){files[e.file]=[e.loaded,e.total];
        let a=0,b=0;for(const k in files){a+=files[k][0];b+=files[k][1];}
        if(S.aiBusy&&S.aiTok===S.loadToken)chip("바닥 인식 준비 중 "+Math.round(a/b*100)+"% (처음 한 번만 받아요)","busy");}
    };
    let last;
    for(const m of MODELS){
      try{const p=await tf.pipeline("image-segmentation",m,{device:"wasm",dtype:"q8",progress_callback:cb});segName=m;return p;}
      catch(e){last=e;console.warn("model failed",m,e);}
    }
    throw last;
  })();
  segP.catch(()=>{segP=null;});
  return segP;
}
/* AI에 넣는 크기: 사진 비율 그대로, 짧은 변 512 */
function modelSize(short){
  const cap=Math.round(short*1.6/32)*32;
  if(S.W<=S.H)return [short,Math.min(cap,Math.max(short,Math.round(short*S.H/S.W/32)*32))];
  return [Math.min(cap,Math.max(short,Math.round(short*S.W/S.H/32)*32)),short];
}
function floorIds(model){
  const id2=(model&&model.config&&model.config.id2label)||{};
  return Object.keys(id2).filter(k=>String(id2[k]).toLowerCase().split(/[^a-z]+/).some(w=>FLOORISH.has(w))).map(Number);
}
function openIds(model){
  const id2=(model&&model.config&&model.config.id2label)||{};
  return Object.keys(id2).filter(k=>OPENING.has(String(id2[k]).trim().toLowerCase())).map(Number);
}
/* 축척 재는 데 쓰는 천장, 벽, 문 */
function namedIds(model,names){
  const id2=(model&&model.config&&model.config.id2label)||{};
  return Object.keys(id2).filter(k=>names.has(String(id2[k]).trim().toLowerCase())).map(Number);
}
const SEM_NAMES={ceil:new Set(["ceiling"]),wall:new Set(["wall"]),door:new Set(["door","double door"])};
/* AI 한 번 돌려서 칸마다 바닥일 확률 구하기 */
async function runModel(seg,mw,mh,flip,ids,oids,sids){
  const ip=(seg.processor&&seg.processor.image_processor)||{};
  const mean=ip.image_mean||[0.485,0.456,0.406],std=ip.image_std||[0.229,0.224,0.225],rs=ip.rescale_factor||1/255;
  const c=document.createElement("canvas");c.width=mw;c.height=mh;
  const x=c.getContext("2d",{willReadFrequently:true});x.imageSmoothingQuality="high";
  if(flip){x.translate(mw,0);x.scale(-1,1);}
  x.drawImage(S.photoCanvas,0,0,mw,mh);
  const d=x.getImageData(0,0,mw,mh).data,n=mw*mh,arr=new Float32Array(3*n);
  for(let i=0;i<n;i++){
    arr[i]=(d[i*4]*rs-mean[0])/std[0];
    arr[n+i]=(d[i*4+1]*rs-mean[1])/std[1];
    arr[2*n+i]=(d[i*4+2]*rs-mean[2])/std[2];
  }
  const input=new TFMOD.Tensor("float32",arr,[1,3,mh,mw]);
  const out=await seg.model({pixel_values:input});
  const lg=out.logits,C=lg.dims[1],lh=lg.dims[2],lw=lg.dims[3],L=lg.data,hw=lh*lw;
  const p=new Float32Array(hw),o=new Float32Array(hw);
  const sk=sids?Object.keys(sids):[],sm={};for(const k of sk)sm[k]=new Float32Array(hw);
  for(let k=0;k<hw;k++){
    let mx=-Infinity;for(let j=0;j<C;j++){const v=L[j*hw+k];if(v>mx)mx=v;}
    let s=0;for(let j=0;j<C;j++)s+=Math.exp(L[j*hw+k]-mx);
    let f=0;for(const id of ids)f+=Math.exp(L[id*hw+k]-mx);
    let g=0;for(const id of oids)g+=Math.exp(L[id*hw+k]-mx);
    p[k]=f/s;o[k]=g/s;
    for(const n of sk){let q=0;for(const id of sids[n])q+=Math.exp(L[id*hw+k]-mx);sm[n][k]=q/s;}
  }
  if(flip)for(const a of [p,o,...sk.map(n=>sm[n])])for(let yy=0;yy<lh;yy++){const r=yy*lw;for(let xx=0;xx<(lw>>1);xx++){const i=r+xx,j=r+lw-1-xx,t=a[i];a[i]=a[j];a[j]=t;}}
  try{if(input.dispose)input.dispose();if(lg.dispose)lg.dispose();}catch(e){}
  return {p,o,sem:sk.length?sm:null,w:lw,h:lh};
}
/* AI 파일이 받는 입력 크기가 정해져 있으면 그 크기를 알려줌 (정해진 크기와 다르게 한 번이라도 넣으면 그 뒤로 계속 고장 남) */
function fixedInput(seg){
  try{
    const ss=seg.model.sessions||{},s=ss.model||Object.values(ss)[0],md=s&&s.inputMetadata;
    const m=md&&(Array.isArray(md)?md.find(x=>x&&x.name==="pixel_values"):md.pixel_values);
    const sh=m&&m.shape;
    if(sh&&sh.length===4&&typeof sh[2]==="number"&&typeof sh[3]==="number"&&sh[2]>0&&sh[3]>0)return [sh[3],sh[2]];
  }catch(e){}
  return null;
}
/* 실패한 AI는 버리고 새로 띄움 (파일은 브라우저에 저장돼 있어서 금방 뜸) */
async function freshModel(seg){
  try{if(seg&&seg.dispose)await seg.dispose();}catch(e){}
  segP=null;
  return ensureModel();
}
async function floorPrior(seg){
  const ids=floorIds(seg.model),oids=openIds(seg.model);
  if(!ids.length)throw new Error("floor label missing");
  const sids={};for(const k in SEM_NAMES){const a=namedIds(seg.model,SEM_NAMES[k]);if(a.length)sids[k]=a;}
  const useSem=sids.ceil&&sids.wall?sids:null;
  const fixed=fixedInput(seg);
  const sizes=fixed?[fixed]:[modelSize(512),[512,512]];
  let last;
  for(const [mw,mh] of sizes){
    try{
      const t0=performance.now();
      const a=await runModel(seg,mw,mh,false,ids,oids,useSem);
      const ms=performance.now()-t0;let tta=false;
      if(ms<2500&&params.get("tta")!=="0"){
        const b=await runModel(seg,mw,mh,true,ids,oids,useSem);
        if(b.w===a.w&&b.h===a.h){
          for(let i=0;i<a.p.length;i++){a.p[i]=(a.p[i]+b.p[i])/2;a.o[i]=(a.o[i]+b.o[i])/2;}
          if(a.sem&&b.sem)for(const k in a.sem){const x=a.sem[k],y=b.sem[k];for(let i=0;i<x.length;i++)x[i]=(x[i]+y[i])/2;}
          tta=true;
        }
      }
      return {p:a.p,o:oids.length?a.o:null,sem:a.sem,w:a.w,h:a.h,info:"AI "+mw+"x"+mh+(tta?" 좌우평균":"")+" "+Math.round(ms)+"ms"};
    }catch(e){last=e;console.warn("floor prior failed at",mw,mh,e);seg=await freshModel(seg);}
  }
  const err=last instanceof Error?last:new Error(String(last));
  err.seg=seg;
  throw err;
}
/* 위 방법이 안 될 때만 쓰는 예전 방식 */
async function floorPriorPipeline(seg){
  const k=Math.min(1,768/Math.max(S.W,S.H));
  const c=document.createElement("canvas");c.width=Math.round(S.W*k);c.height=Math.round(S.H*k);
  c.getContext("2d").drawImage(S.photoCanvas,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.92));
  const url=URL.createObjectURL(blob);
  const t=Math.min(1,320/Math.max(c.width,c.height)),tw=Math.round(c.width*t),th=Math.round(c.height*t);
  let out;try{out=await seg(url,{target_sizes:[[th,tw]]});}finally{URL.revokeObjectURL(url);}
  const p=new Float32Array(tw*th);
  for(const s of out){
    const words=String(s.label||"").toLowerCase().split(/[^a-z]+/);
    if(!words.some(w=>FLOORISH.has(w)))continue;
    const m=s.mask,ch=m.channels||1,d=m.data,sx=m.width/tw,sy=m.height/th;
    for(let y=0;y<th;y++)for(let x=0;x<tw;x++)if(d[(Math.floor(y*sy)*m.width+Math.floor(x*sx))*ch]>127)p[y*tw+x]=1;
  }
  return {p,o:null,w:tw,h:th,info:"기본 방식"};
}
function upsample(p,pw,ph,W,H){
  const out=new Float32Array(W*H);
  for(let y=0;y<H;y++){
    const sy=Math.max(0,Math.min(ph-1,(y+.5)*ph/H-.5)),y0=Math.floor(sy),y1=Math.min(ph-1,y0+1),fy=sy-y0;
    for(let x=0;x<W;x++){
      const sx=Math.max(0,Math.min(pw-1,(x+.5)*pw/W-.5)),x0=Math.floor(sx),x1=Math.min(pw-1,x0+1),fx=sx-x0;
      out[y*W+x]=(p[y0*pw+x0]*(1-fx)+p[y0*pw+x1]*fx)*(1-fy)+(p[y1*pw+x0]*(1-fx)+p[y1*pw+x1]*fx)*fy;
    }
  }
  return out;
}
/* 바닥 찾기는 한 번에 하나씩 차례로 (AI를 동시에 두 번 돌리면 고장 남)
   기다리는 동안 다른 사진으로 바뀌었으면 건너뜀 */
let detectQ=Promise.resolve();
function queueDetect(tok){
  chip("바닥 찾는 중이에요","busy");
  detectQ=detectQ.then(()=>tok===S.loadToken?detectFloor(tok):null).catch(e=>console.error(e));
  return detectQ;
}
async function detectFloor(tok){
  if(tok==null)tok=S.loadToken;
  const live=()=>tok===S.loadToken;
  S.aiBusy=true;S.aiTok=tok;chip("바닥 찾는 중이에요","busy");
  try{
    const seg=await ensureModel();
    if(!live())return;
    chip("바닥 찾는 중이에요","busy");
    await new Promise(r=>setTimeout(r,30));
    if(!live())return;
    let pr;
    try{pr=await floorPrior(seg);}
    catch(e){console.warn("fallback to pipeline",e);if(!live())return;pr=await floorPriorPipeline(e&&e.seg?e.seg:await freshModel(seg));}
    if(!live())return;
    chip("바닥 경계 다듬는 중이에요","busy");
    await new Promise(r=>setTimeout(r,30));
    if(!live())return;
    const k=Math.min(1,800/Math.max(S.W,S.H)),ww=Math.max(8,Math.round(S.W*k)),wh=Math.max(8,Math.round(S.H*k));
    const c=document.createElement("canvas");c.width=ww;c.height=wh;
    const x=c.getContext("2d",{willReadFrequently:true});x.imageSmoothingQuality="high";
    x.drawImage(S.photoCanvas,0,0,ww,wh);
    const img=x.getImageData(0,0,ww,wh);
    const prior=upsample(pr.p,pr.w,pr.h,ww,wh);
    const open=pr.o?upsample(pr.o,pr.w,pr.h,ww,wh):null;
    let soft=prior,note="";
    if(window.FloorRefine&&params.get("refine")!=="0"){
      try{
        const t1=performance.now(),r=window.FloorRefine.refine(img.data,ww,wh,prior,{open});
        soft=r.soft;note=" · 다듬기 "+Math.round(performance.now()-t1)+"ms"+(r.patterned?" 무늬":"");
      }catch(e){console.error("refine failed",e);note=" · 다듬기 실패";}
    }
    let area=0;
    const od=x.createImageData(ww,wh);
    for(let i=0;i<soft.length;i++){
      const v=Math.round(Math.max(0,Math.min(1,soft[i]))*255);
      od.data[i*4]=od.data[i*4+1]=od.data[i*4+2]=v;od.data[i*4+3]=255;if(v>127)area++;
    }
    x.putImageData(od,0,0);
    S.aiInfo=pr.info+note;
    S.sem=pr.sem?{ceil:pr.sem.ceil,wall:pr.sem.wall,door:pr.sem.door||null,w:pr.w,h:pr.h}:null;
    if(params.get("debug")==="1")$("gpuNote").textContent="버전 "+VERSION+" · "+S.aiInfo;
    if(area<soft.length*.03){fallbackMask();applyAuto();chip("바닥을 잘 못 찾았어요. 바닥 고치기로 칠해 주세요","warn");}
    else{setMask(c);applyAuto();chip("다른 색상도 눌러 보세요","");}
    histSave(true);
  }catch(e){
    console.error(e);
    if(!live())return;
    fallbackMask();applyAuto();
    chip("자동 인식이 안 됐어요. 바닥 고치기로 범위를 칠해 주세요","warn");
    histSave(true);
  }finally{if(S.aiTok===tok)S.aiBusy=false;}
}
/* 바닥 경계선과 원래 바닥 줄눈으로 방의 가로세로 방향, 카메라 기울기 찾기 */
function orientFloor(p0){
  const out={pitch:p0,roll:0,rot:90,info:""};
  if(!window.FloorOrient||!S.W)return out;
  try{
    const k=Math.min(1,480/Math.max(S.W,S.H)),w=Math.max(8,Math.round(S.W*k)),h=Math.max(8,Math.round(S.H*k));
    const pd=shrink(S.photoCanvas,w,h),md=shrink(S.maskCanvas,w,h),n=w*h;
    const lum=new Float32Array(n),mask=new Float32Array(n);
    for(let i=0;i<n;i++){lum[i]=(.2126*pd[i*4]+.7152*pd[i*4+1]+.0722*pd[i*4+2])/255;mask[i]=md[i*4]/255;}
    const t0=performance.now();
    const r=window.FloorOrient.estimate({mask,lum,w,h,W:S.W,H:S.H,pitch0:p0,fovAdj:S.fov||0});
    out.pitch=r.pitch;out.roll=r.roll;
    if(r.beta!=null){
      /* 같은 방향 후보 둘 중 앞으로 뻗는 쪽(90도에 가까운 쪽)을 기본으로: 마루는 앞으로 뻗게 깔림 */
      const a=r.beta,b=r.beta+90;
      out.rot=Math.abs(a-90)<=Math.abs(b-90)?a:b;
    }
    out.info="방향 "+(r.beta==null?"못 찾음":r.beta.toFixed(1)+"도")+" 기울기 "+p0.toFixed(1)+"→"+r.pitch.toFixed(1)+" 점수 "+r.score.toFixed(3)+" "+Math.round(performance.now()-t0)+"ms";
  }catch(e){console.error("orient failed",e);}
  return out;
}
function applyAuto(){
  const p=estimatePitch(),p0=p==null?35:p;
  computeLighting();
  const o=orientFloor(p0);
  S.autoPitch=o.pitch;S.autoRoll=o.roll;S.autoRot=o.rot;S.rotStep=0;
  S.pitch=S.autoPitch;S.roll=S.autoRoll;S.rot=S.autoRot;
  S.orientInfo=o.info;
  calibrateScale();
  debugNote();render();
}
function debugNote(){
  if(params.get("debug")==="1")$("gpuNote").textContent=["버전 "+VERSION,S.aiInfo,S.orientInfo,S.lensInfo,S.camInfo,S.lightInfo].filter(Boolean).join(" · ");
}
/* 타일 축척: 사진 촬영 정보의 렌즈 초점거리로 화각을 맞춤 (없으면 보통 폰 기본 렌즈 26mm로 봄) */
function applyLens(ex){
  const ff=ex&&ex.f35&&window.FloorCamera?window.FloorCamera.focalFactor(ex.f35,S.W,S.H):null;
  S.fov=ff?Math.max(-160,Math.min(210,100*Math.log2(ff/.728))):0;
  S.lensInfo=ff?"렌즈 "+Math.round(ex.f35)+"mm":"렌즈 정보 없음";
}
function readLens(file){
  return (async()=>{
    try{
      if(!window.FloorCamera||!file||!file.slice)return null;
      const buf=await file.slice(0,Math.min(file.size,16*1024*1024)).arrayBuffer();
      return window.FloorCamera.exifInfo(buf);
    }catch(e){return null;}
  })();
}
/* 타일 축척: 천장선(2.3m), 문 윗선(2.1m)으로 카메라 높이를 재서 타일 크기를 방 크기에 맞춤 (안 보이면 1.4m) */
function calibrateScale(){
  S.camH=1400;S.camInfo="카메라 높이 기본 1.40m";
  if(!window.FloorCamera||!S.sem)return;
  try{
    const mw=Math.min(400,S.W),mh=Math.max(8,Math.round(S.H*mw/S.W));
    const md=shrink(S.maskCanvas,mw,mh),mask=new Float32Array(mw*mh);
    for(let i=0;i<mask.length;i++)mask[i]=md[i*4]/255;
    const r=window.FloorCamera.cameraHeight({mask,mw,mh,sem:S.sem,W:S.W,H:S.H,f:focal(),pitch:S.autoPitch,roll:S.autoRoll});
    S.camH=r.camH;
    S.camInfo="카메라 높이 "+(r.camH/1000).toFixed(2)+"m "+(r.src==="기본"?"기본":r.src+" 기준")+(r.n?" 천장"+r.ceil+" 문"+r.door:"");
  }catch(e){console.warn("scale failed",e);}
}

/* 제품 무늬 캐시: 최근 3개 제품만 (4장짜리는 큼직해서 폰 메모리 아끼려고) */
const tileCache=new Map();
function cacheTile(key,layers){
  tileCache.delete(key);tileCache.set(key,layers);
  while(tileCache.size>3){
    const [k,v]=tileCache.entries().next().value;tileCache.delete(k);
    if(v!==S.tileLayers)for(const c of v){try{c.width=c.height=0;}catch(e){}}
  }
}
/* 4장 세트 이미지(2×2, 줄눈 없이 붙인 것) → 4장으로 나눠 장마다 밝기 기울기 펴기 */
function splitSet(img){
  const W=img.naturalWidth||img.width,q=Math.floor(W/2),L=Math.min(1024,q);
  return [0,1,2,3].map(k=>{
    const c=document.createElement("canvas");c.width=c.height=L;
    const x=c.getContext("2d",{willReadFrequently:true});x.imageSmoothingQuality="high";
    x.drawImage(img,(k%2)*q,(k>>1)*q,q,q,0,0,L,L);
    try{return flattenTile(c);}catch(e){return c;}
  });
}
/* 제품 사진에 들어 있는 큰 밝기 기울기(조명, 비네팅)를 펴서, 타일마다 같은 그림자가 반복돼 보이지 않게 함
   무늬는 그대로 두고 아주 완만한 밝기 변화(2차 곡면)만 빼냄 */
function flattenTile(img){
  const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
  const k=Math.min(1,1024/Math.max(iw,ih)),w=Math.max(2,Math.round(iw*k)),h=Math.max(2,Math.round(ih*k));
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0,w,h);
  const id=x.getImageData(0,0,w,h),d=id.data,n=w*h;
  const lin=new Float32Array(256);for(let i=0;i<256;i++)lin[i]=Math.pow(i/255,2.2);
  const G=24,gs=new Float64Array(G*G),gc=new Float64Array(G*G);
  for(let y=0;y<h;y++){const gy=Math.min(G-1,(y*G/h)|0);for(let xx=0;xx<w;xx++){const i=(y*w+xx)*4,gx=Math.min(G-1,(xx*G/w)|0);
    gs[gy*G+gx]+=.2126*lin[d[i]]+.7152*lin[d[i+1]]+.0722*lin[d[i+2]];gc[gy*G+gx]++;}}
  /* 2차 곡면 맞추기 (최소제곱) */
  const M=new Float64Array(36),bv=new Float64Array(6);let mean=0,cnt=0;
  for(let gy=0;gy<G;gy++)for(let gx=0;gx<G;gx++){const j=gy*G+gx;if(!gc[j])continue;const v=gs[j]/gc[j];mean+=v;cnt++;
    const u=(gx+.5)/G-.5,t=(gy+.5)/G-.5,f=[1,u,t,u*u,u*t,t*t];
    for(let a=0;a<6;a++){bv[a]+=f[a]*v;for(let b=0;b<6;b++)M[a*6+b]+=f[a]*f[b];}}
  mean/=cnt||1;
  for(let a=0;a<6;a++){let p=a;for(let r=a+1;r<6;r++)if(Math.abs(M[r*6+a])>Math.abs(M[p*6+a]))p=r;
    if(p!==a){for(let b=0;b<6;b++){const tt=M[a*6+b];M[a*6+b]=M[p*6+b];M[p*6+b]=tt;}const tt=bv[a];bv[a]=bv[p];bv[p]=tt;}
    const piv=M[a*6+a];if(Math.abs(piv)<1e-12)return c;
    for(let r=0;r<6;r++){if(r===a)continue;const fct=M[r*6+a]/piv;if(!fct)continue;for(let b=a;b<6;b++)M[r*6+b]-=fct*M[a*6+b];bv[r]-=fct*bv[a];}}
  const co=bv.map((v,a)=>v/M[a*6+a]);
  const out=x.createImageData(w,h),o=out.data;
  for(let y=0;y<h;y++){const t=(y+.5)/h-.5;for(let xx=0;xx<w;xx++){const u=(xx+.5)/w-.5;
    const fit=co[0]+co[1]*u+co[2]*t+co[3]*u*u+co[4]*u*t+co[5]*t*t;
    const g=Math.max(.75,Math.min(1.33,mean/Math.max(1e-4,fit)));
    const i=(y*w+xx)*4;
    for(let ch=0;ch<3;ch++)o[i+ch]=Math.max(0,Math.min(255,Math.round(255*Math.pow(Math.min(1,lin[d[i+ch]]*g),1/2.2))));
    o[i+3]=255;}}
  x.putImageData(out,0,0);
  return c;
}
function selectProduct(i){
  const p=PRODUCTS[i];if(!p)return;
  S.product=p;
  const box=$("swatches");
  [...box.children].forEach((b,j)=>b.setAttribute("aria-pressed",String(j===i)));
  const btn=box.children[i];
  if(btn&&box.scrollWidth>box.clientWidth+2){
    const left=Math.max(0,btn.offsetLeft-(box.clientWidth-btn.offsetWidth)/2);
    try{box.scrollTo({left,behavior:"smooth"});}catch(e){box.scrollLeft=left;}
  }
  $("pName").textContent=p.name;$("pSpec").textContent=specText(p);
  const a=$("pLink");if(p.url){a.href=p.url;a.hidden=false;}else a.hidden=true;
  const done=layers=>{if(S.product!==p)return;S.tileLayers=layers;uploadTileLayers(layers);S.tileReady=true;render();};
  /* 무늬 4장 세트(tiles4)가 있으면 4장을 섞어 깔고, 없으면 한 장으로 */
  const load=(src,isSet)=>{
    if(tileCache.has(src)){const v=tileCache.get(src);cacheTile(src,v);return done(v);}
    const img=new Image();
    img.onload=()=>{let layers;
      try{layers=isSet?splitSet(img):[flattenTile(img)];}catch(e){console.warn("tile prep failed",e);const c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext("2d").drawImage(img,0,0);layers=[c];}
      cacheTile(src,layers);done(layers);};
    img.onerror=()=>{if(isSet&&p.image)load(p.image,false);else chip("제품 이미지를 못 불러왔어요: "+src,"warn");};
    img.src=bust(src);
  };
  if(p.tiles4)load(p.tiles4,true);else load(p.image,false);
}

/* 사진 고르는 동안 휴대폰이 화면을 새로 열어 버렸는지 알아내기 위한 표시 */
function markPick(){try{sessionStorage.setItem(PICK_KEY,String(Date.now()));}catch(e){}}
function clearPick(){try{sessionStorage.removeItem(PICK_KEY);}catch(e){}}
function pickInterrupted(){
  try{const t=+sessionStorage.getItem(PICK_KEY);clearPick();return !!t&&Date.now()-t<10*60*1000;}catch(e){return false;}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")setTimeout(clearPick,4000);});

function loadScript(src){
  return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.async=true;
    s.onload=()=>res();s.onerror=()=>rej(new Error("script load failed: "+src));document.head.append(s);});
}
async function isHeif(f){
  if(/heic|heif/i.test(f.type||"")||/\.(heic|heif)$/i.test(f.name||""))return true;
  try{
    const h=new Uint8Array(await f.slice(0,32).arrayBuffer());
    const s=String.fromCharCode.apply(null,h);
    return s.slice(4,8)==="ftyp"&&/heic|heix|hevc|hevx|heim|heis|mif1|msf1/.test(s.slice(8,32));
  }catch(e){return false;}
}
function decodeBlob(blob){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(blob),img=new Image();
    img.onload=async()=>{try{if(img.decode)await img.decode();}catch(e){} res({img,url});};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("decode failed"));};
    img.src=url;
  });
}
async function heicToJpeg(f){
  if(!window.heic2any)await loadScript(HEIC_URL);
  const out=await window.heic2any({blob:f,toType:"image/jpeg",quality:.9});
  return Array.isArray(out)?out[0]:out;
}
let loadingPhoto=false;
async function onFile(e){
  const input=e.target,f=input.files&&input.files[0];
  clearPick();
  if(!f||loadingPhoto)return;
  loadingPhoto=true;
  const tok=newLoad();
  chip("사진 불러오는 중이에요","busy");
  /* 사진 파일 속 촬영 정보(렌즈)는 그림 푸는 동안 같이 읽어 둠 */
  const lensP=readLens(f);
  let got=null;
  try{
    try{got=await decodeBlob(f);}
    catch(err){
      if(!(await isHeif(f)))throw err;
      chip("사진 형식을 바꾸는 중이에요. 잠시만 기다려 주세요","busy");
      got=await decodeBlob(await heicToJpeg(f));
    }
    const lens=await lensP;
    if(tok!==S.loadToken)return;
    exitModes();
    setPhoto(got.img);
    applyLens(lens);
    /* 최근 사진에 바로 저장 (바닥 범위는 찾고 나서 덧붙임) */
    S.histId=histNewId();
    histAdd(S.histId,S.photoCanvas,{fov:S.fov,lens:S.lensInfo});
  }catch(err){
    console.error(err);
    if(tok===S.loadToken)chip("이 사진은 열 수 없어요. 다시 찍거나 다른 사진을 골라 주세요","warn");
    return;
  }finally{
    if(got)URL.revokeObjectURL(got.url);
    input.value="";loadingPhoto=false;
  }
  if(tok!==S.loadToken)return;
  if(params.get("noai")==="1"){fallbackMask();applyAuto();chip("범위를 직접 칠해 주세요","warn");histSave(true);}
  else queueDetect(tok);
}
["fileCam","fileAlbum"].forEach(id=>{

/* ---------- 최근 올린 사진 ----------
   이 기기 브라우저 안(IndexedDB)에만 저장, 최대 20장. 서버로는 아무것도 안 보냄
   meta: 목록, 썸네일, 맞춘 값 / photo: 사진 / mask: 바닥 범위 (셋 다 같은 id로) */
const HIST_DB="floorPreviewHistory",HIST_MAX=20,HIST_STORES=["meta","photo","mask"];
let histDB=null,histList=[],histOK=true,histQ=Promise.resolve();
const histURL=new Map();
function histNewId(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);}
function histOpen(){
  if(histDB)return histDB;
  histDB=new Promise((res,rej)=>{
    let r;
    try{r=indexedDB.open(HIST_DB,1);}catch(e){rej(e);return;}
    r.onupgradeneeded=()=>{const db=r.result;HIST_STORES.forEach(n=>{if(!db.objectStoreNames.contains(n))db.createObjectStore(n);});};
    r.onsuccess=()=>{const db=r.result;db.onversionchange=()=>{try{db.close();}catch(e){}histDB=null;};res(db);};
    r.onerror=()=>rej(r.error||new Error("idb open failed"));
    r.onblocked=()=>rej(new Error("idb blocked"));
  });
  histDB.catch(()=>{histDB=null;});
  return histDB;
}
async function histTx(mode,fn){
  const db=await histOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(HIST_STORES,mode),out={};
    tx.oncomplete=()=>res(out);
    tx.onerror=()=>rej(tx.error||new Error("idb error"));
    tx.onabort=()=>rej(tx.error||new Error("idb abort"));
    try{fn(tx,out);}catch(e){try{tx.abort();}catch(_){}rej(e);}
  });
}
/* 저장, 읽기는 한 줄로 차례차례 (방금 올린 사진 저장이 끝나기 전에 바닥 범위 저장이 먼저 가지 않게) */
function histRun(fn){
  const p=histQ.then(fn);
  histQ=p.catch(e=>console.warn("최근 사진 처리 실패",e));
  return p;
}
function histDrop(ids){return histTx("readwrite",tx=>ids.forEach(id=>HIST_STORES.forEach(s=>tx.objectStore(s).delete(id))));}
function toBlob(c,type,q){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("toBlob failed")),type,q));}
function blobBuf(b){return b.arrayBuffer?b.arrayBuffer():new Response(b).arrayBuffer();}
/* 사파리 일부 버전이 Blob 저장을 못 해서 바이트 배열로 저장 */
async function packCanvas(c,type,q){return {buf:await blobBuf(await toBlob(c,type,q)),type};}
function thumbOf(src,short){
  let c=src,w=src.width,h=src.height;const k=short/Math.min(w,h);
  if(k>=1)return src;
  const tw=Math.max(1,Math.round(w*k)),th=Math.max(1,Math.round(h*k));
  while(w/2>tw){const n=document.createElement("canvas");n.width=Math.round(w/2);n.height=Math.round(h/2);n.getContext("2d",{willReadFrequently:true}).drawImage(c,0,0,n.width,n.height);c=n;w=n.width;h=n.height;}
  const n=document.createElement("canvas");n.width=tw;n.height=th;
  const x=n.getContext("2d",{willReadFrequently:true});x.imageSmoothingQuality="high";x.drawImage(c,0,0,tw,th);return n;
}
function curParams(){return {pitch:S.pitch,roll:S.roll,fov:S.fov,rot:S.rot,rotStep:S.rotStep,autoPitch:S.autoPitch,autoRoll:S.autoRoll,autoRot:S.autoRot,camH:S.camH,info:S.orientInfo||"",camInfo:S.camInfo||"",lens:S.lensInfo||""};}
function ago(t){const s=Math.max(0,(Date.now()-t)/1000);if(s<90)return "방금";if(s<3600)return Math.round(s/60)+"분 전";if(s<86400)return Math.round(s/3600)+"시간 전";return Math.round(s/86400)+"일 전";}
function histRender(){
  const box=$("thumbs"),keep=new Set(histList.map(m=>m.id));
  for(const [id,u] of histURL)if(!keep.has(id)){URL.revokeObjectURL(u);histURL.delete(id);}
  box.textContent="";
  $("recent").hidden=!histOK||!histList.length;
  for(const m of histList){
    const it=document.createElement("div");it.className="th";it.setAttribute("role","listitem");
    const b=document.createElement("button");b.type="button";b.className="th-open";b.dataset.id=m.id;
    b.setAttribute("aria-pressed",String(m.id===S.histId));b.setAttribute("aria-label",ago(m.t)+" 올린 사진 다시 보기");
    const im=document.createElement("img");im.alt="";im.decoding="async";
    let u=histURL.get(m.id);
    if(!u&&m.thumb){try{u=URL.createObjectURL(new Blob([m.thumb.buf],{type:m.thumb.type||"image/jpeg"}));histURL.set(m.id,u);}catch(e){}}
    if(u)im.src=u;
    b.append(im);b.onclick=()=>histRestore(m.id);
    const d=document.createElement("button");d.type="button";d.className="th-del";d.innerHTML="<span aria-hidden=\"true\">×</span>";d.setAttribute("aria-label",ago(m.t)+" 올린 사진 지우기");
    d.onclick=e=>{e.stopPropagation();histDelete(m.id);};
    it.append(b,d);box.append(it);
  }
}
function histMark(){for(const b of $("thumbs").querySelectorAll(".th-open"))b.setAttribute("aria-pressed",String(b.dataset.id===S.histId));}
async function histInit(){
  try{
    if(!window.indexedDB)throw new Error("no indexedDB");
    const out=await histRun(()=>histTx("readonly",(tx,o)=>{
      o.list=[];const r=tx.objectStore("meta").openCursor();
      r.onsuccess=()=>{const c=r.result;if(c){if(c.value&&c.value.id)o.list.push(c.value);c.continue();}};
    }));
    const have=new Set(histList.map(m=>m.id));
    histList=histList.concat(out.list.filter(m=>!have.has(m.id))).sort((a,b)=>b.t-a.t);
    const extra=histList.splice(HIST_MAX);
    if(extra.length)histRun(()=>histDrop(extra.map(m=>m.id)));
    histRender();
  }catch(e){console.warn("최근 사진 기능을 끔",e);histOK=false;$("recent").hidden=true;}
}
function histAdd(id,canvas,lens){
  if(!histOK)return;
  const w=canvas.width,h=canvas.height;
  histRun(async()=>{
    const [photo,thumb]=await Promise.all([packCanvas(canvas,"image/jpeg",.9),packCanvas(thumbOf(canvas,216),"image/jpeg",.8)]);
    const meta={id,t:Date.now(),w,h,thumb,hasMask:false,params:null,fov:lens&&lens.fov||0,lens:lens&&lens.lens||""};
    const put=()=>histTx("readwrite",tx=>{tx.objectStore("meta").put(meta,id);tx.objectStore("photo").put(photo,id);});
    try{await put();}
    catch(e){
      /* 저장 공간이 모자라면 오래된 사진 몇 장을 지우고 한 번 더 */
      const old=histList.splice(Math.max(1,histList.length-5));
      if(!old.length)throw e;
      await histDrop(old.map(m=>m.id));
      await put();
    }
    histList.unshift(meta);
    const extra=histList.splice(HIST_MAX);
    if(extra.length)await histDrop(extra.map(m=>m.id));
    histRender();$("thumbs").scrollLeft=0;
  });
}
/* 바닥 범위(withMask)와 맞춘 값을 지금 사진 기록에 덧붙임 */
function histSave(withMask){
  const id=S.histId;if(!id||!histOK)return;
  const mc=withMask?S.maskCanvas:null,params=curParams();
  histRun(async()=>{
    const m=histList.find(x=>x.id===id);if(!m)return;
    const mask=mc?await packCanvas(mc,"image/png"):null;
    if(!histList.includes(m))return;
    const meta=Object.assign({},m,{params,hasMask:m.hasMask||!!mask});
    await histTx("readwrite",tx=>{tx.objectStore("meta").put(meta,id);if(mask)tx.objectStore("mask").put(mask,id);});
    Object.assign(m,meta);
  });
}
function histDelete(id){
  histList=histList.filter(m=>m.id!==id);
  if(S.histId===id)S.histId=null;
  histRender();
  histRun(()=>histDrop([id]));
}
function histClearAll(){
  const ids=histList.map(m=>m.id);
  histList=[];S.histId=null;histRender();
  histRun(()=>histTx("readwrite",tx=>HIST_STORES.forEach(s=>tx.objectStore(s).clear())));
  if(ids.length)chip("최근 사진을 모두 지웠어요","");
}
function histApplyParams(p){
  if(!p||!["pitch","rot","autoPitch","autoRot"].every(k=>Number.isFinite(p[k])))return false;
  const n=(v,d)=>Number.isFinite(v)?v:d;
  computeLighting();
  S.autoPitch=p.autoPitch;S.autoRoll=n(p.autoRoll,0);S.autoRot=p.autoRot;S.rotStep=n(p.rotStep,0);
  S.pitch=p.pitch;S.roll=n(p.roll,0);S.fov=n(p.fov,0);S.rot=p.rot;
  /* 예전 기록(세부 조정 시절)은 타일 크기 값으로 카메라 높이를 대신함 */
  S.camH=Number.isFinite(p.camH)?p.camH:1400/n(p.scale,1);
  S.orientInfo=String(p.info||"");S.camInfo=String(p.camInfo||"");S.lensInfo=String(p.lens||"");
  S.aiInfo="최근 사진";debugNote();render();
  return true;
}
const n0=v=>Number.isFinite(v)?v:0;
/* 썸네일 누르면: AI 다시 안 돌리고 저장해 둔 바닥 범위와 맞춘 값으로 바로 보여줌 */
async function histRestore(id){
  if(!histOK||id===S.histId)return;
  const m=histList.find(x=>x.id===id);if(!m)return;
  exitModes();
  const tok=newLoad(),urls=[];
  chip("사진 불러오는 중이에요","busy");
  try{
    const rec=await histRun(()=>histTx("readonly",(tx,o)=>{
      tx.objectStore("photo").get(id).onsuccess=e=>{o.photo=e.target.result;};
      tx.objectStore("mask").get(id).onsuccess=e=>{o.mask=e.target.result;};
    }));
    if(tok!==S.loadToken)return;
    const gone=()=>{const e=new Error("saved photo missing");e.gone=true;return e;};
    if(!rec||!rec.photo||!rec.photo.buf)throw gone();
    let p;
    try{p=await decodeBlob(new Blob([rec.photo.buf],{type:rec.photo.type||"image/jpeg"}));urls.push(p.url);}catch(e){throw gone();}
    let mk=null;
    if(m.hasMask&&rec.mask&&rec.mask.buf){try{mk=await decodeBlob(new Blob([rec.mask.buf],{type:rec.mask.type||"image/png"}));urls.push(mk.url);}catch(e){mk=null;}}
    if(tok!==S.loadToken)return;
    setPhoto(p.img,true);S.histId=id;histMark();
    S.fov=n0(m.fov);S.lensInfo=String(m.lens||"");
    if(mk){
      setMask(mk.img);
      if(!histApplyParams(m.params))applyAuto();
      chip("다른 색상도 눌러 보세요","");
    }else if(params.get("noai")==="1"){fallbackMask();applyAuto();chip("범위를 직접 칠해 주세요","warn");histSave(true);}
    else queueDetect(tok);
  }catch(e){
    console.warn("최근 사진 열기 실패",e);
    if(tok===S.loadToken)chip("이 사진은 다시 불러오지 못했어요","warn");
    if(e&&e.gone)histDelete(id);
  }finally{urls.forEach(u=>URL.revokeObjectURL(u));}
}
let clearArmed=false,clearTimer=null;
$("rClear").onclick=()=>{
  const b=$("rClear");
  if(!clearArmed){
    clearArmed=true;b.textContent="한 번 더 누르면 다 지워져요";b.classList.add("armed");
    clearTimer=setTimeout(()=>{clearArmed=false;b.textContent="모두 지우기";b.classList.remove("armed");},3500);
    return;
  }
  clearTimeout(clearTimer);clearArmed=false;b.textContent="모두 지우기";b.classList.remove("armed");
  histClearAll();
};
/* 바닥 고치기 중에 앱을 닫아도 고친 데까지는 남게 */
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&S.histId&&S.brush)histSave(true);});

/* ---------- 도구 ---------- */
function exitModes(){setBrush(false);}
function setCompare(on){
  S.compare=on;$("tCompare").setAttribute("aria-pressed",String(on));
  if(on){setBrush(false);S.split=.5;}
  $("stage").classList.toggle("comparing",on);
  $("split").hidden=$("tagL").hidden=$("tagR").hidden=!on;
  updateSplitUI();render();
}
function updateSplitUI(){
  if(!S.compare)return;
  const st=$("stage").getBoundingClientRect(),r=view.getBoundingClientRect();
  $("split").style.left=(r.left-st.left+r.width*S.split-1)+"px";
  $("split").style.top=(r.top-st.top)+"px";$("split").style.bottom="auto";$("split").style.height=r.height+"px";
}
function setBrush(on){
  const was=S.brush;
  S.brush=on;$("tBrush").setAttribute("aria-pressed",String(on));$("brushPanel").hidden=!on;
  $("stage").classList.toggle("drawing",on);
  if(on){if(S.compare)setCompare(false);chip("파란 곳이 바닥으로 잡힌 범위예요","");}
  else if(was){computeLighting();histSave(true);}
  render();
}
$("tCompare").onclick=()=>setCompare(!S.compare);
$("tBrush").onclick=()=>setBrush(!S.brush);
/* 방향 버튼: 자동으로 맞춘 방향에서 90도, 대각선 순서로 돌려봄 */
$("tRotate").onclick=()=>{const steps=[0,90,45,135];S.rotStep=(S.rotStep+1)%steps.length;S.rot=Math.round(((S.autoRot+steps[S.rotStep])%180)*10)/10;render();histSave(false);};
$("bAdd").onclick=()=>{S.brushAdd=true;$("bAdd").setAttribute("aria-pressed","true");$("bErase").setAttribute("aria-pressed","false");};
$("bErase").onclick=()=>{S.brushAdd=false;$("bAdd").setAttribute("aria-pressed","false");$("bErase").setAttribute("aria-pressed","true");};
$("bSize").oninput=e=>{S.brushSize=+e.target.value;$("bSizeOut").textContent=S.brushSize;};
$("bSizeOut").textContent=S.brushSize;
$("bUndo").onclick=()=>{const d=S.undo.pop();if(d){S.maskCtx.putImageData(d,0,0);uploadMask();render();}};
$("bDone").onclick=()=>setBrush(false);


/* 조명 색온도 막대와 버튼 */
function initCT(){
  const r=$("ctRange");
  /* 막대 색: 실제 그 색온도 빛 색 (흰색 쪽으로 반쯤 섞어 보기 좋게) */
  const stops=[];
  for(let k=CT_MIN;k<=CT_MAX;k+=500){
    const c=cctRGB(k),m=Math.max(...c),hex=c.map(v=>{const sv=Math.pow(Math.min(1,v/m),1/2.2);return Math.round((sv*.6+.4)*255);});
    stops.push("rgb("+hex.join(",")+") "+((k-CT_MIN)/(CT_MAX-CT_MIN)*100).toFixed(1)+"%");
  }
  r.style.setProperty("--ct-grad","linear-gradient(90deg,"+stops.join(",")+")");
  r.addEventListener("input",()=>{S.cctSet=+r.value;updateWB();render();});
  for(const b of document.querySelectorAll(".ct-presets button"))b.onclick=()=>{S.cctSet=b.dataset.k?+b.dataset.k:null;updateWB();render();};
  ctUI();
}

/* ---------- 손가락 입력: 붓, 비교선 ---------- */
let drawing=false,lastPt=null;
function toImg(e){const r=view.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*S.W,y:(e.clientY-r.top)/r.height*S.H,k:S.W/r.width};}
function stamp(x,y,rad){
  const c=S.maskCtx,col=S.brushAdd?"255,255,255":"0,0,0";
  const g=c.createRadialGradient(x,y,rad*.55,x,y,rad);g.addColorStop(0,"rgba("+col+",1)");g.addColorStop(1,"rgba("+col+",0)");
  c.fillStyle=g;c.beginPath();c.arc(x,y,rad,0,Math.PI*2);c.fill();
}
view.addEventListener("pointerdown",e=>{
  if(S.brush){
    drawing=true;view.setPointerCapture(e.pointerId);
    S.undo.push(S.maskCtx.getImageData(0,0,S.W,S.H));if(S.undo.length>8)S.undo.shift();
    const p=toImg(e);lastPt=p;stamp(p.x,p.y,S.brushSize/2*p.k);uploadMask();render();e.preventDefault();
  }else if(S.compare){drawing=true;view.setPointerCapture(e.pointerId);moveSplit(e);e.preventDefault();}
});
view.addEventListener("pointermove",e=>{
  if(!drawing)return;
  if(S.brush){
    const p=toImg(e),rad=S.brushSize/2*p.k,dx=p.x-lastPt.x,dy=p.y-lastPt.y,dist=Math.hypot(dx,dy),step=Math.max(1,rad/4);
    for(let t=step;t<=dist;t+=step)stamp(lastPt.x+dx*t/dist,lastPt.y+dy*t/dist,rad);
    if(dist>=step)lastPt=p;
    uploadMask();render();
  }else if(S.compare)moveSplit(e);
});
["pointerup","pointercancel"].forEach(t=>view.addEventListener(t,()=>{drawing=false;}));
function moveSplit(e){const r=view.getBoundingClientRect();S.split=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));updateSplitUI();render();}
window.addEventListener("resize",updateSplitUI);

/* ---------- 저장 ---------- */
$("tSave").onclick=async()=>{
  if(!S.W)return;
  const wasCmp=S.compare,wasB=S.brush;S.compare=false;S.brush=false;draw();
  const c=document.createElement("canvas");c.width=S.W;c.height=S.H;const x=c.getContext("2d");x.drawImage(view,0,0);
  S.compare=wasCmp;S.brush=wasB;render();
  const fs=Math.max(14,Math.round(S.W/42)),pad=Math.round(fs*.8);
  const label=[SHOP.name,S.product&&S.product.name].filter(Boolean).join("  ");
  if(label){x.font="600 "+fs+"px "+getComputedStyle(document.body).fontFamily;const tw=x.measureText(label).width;
    x.fillStyle="rgba(0,0,0,.5)";x.fillRect(S.W-tw-pad*3,S.H-fs-pad*2.4,tw+pad*2,fs+pad*1.4);
    x.fillStyle="#fff";x.textBaseline="middle";x.fillText(label,S.W-tw-pad*2,S.H-fs/2-pad*1.7);}
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.92));
  const name=(SHOP.name||"floor")+"_"+(S.product?S.product.code||"preview":"preview")+".jpg";
  const file=new File([blob],name,{type:"image/jpeg"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"우리집 바닥 미리보기"});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
};

/* ---------- 시작 ---------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function start(){
  if(!gl)return;
  try{initGL();}catch(e){console.error(e);chip("미리보기 화면을 켤 수 없어요","warn");return;}
  buildSwatches();
  const want=String(params.get("item")||"").trim().toLowerCase();let idx=Math.max(0,PRODUCTS.findIndex(p=>String(p.code).toLowerCase()===want));
  selectProduct(idx);
  initCT();
  S.grid=params.get("debug")==="1"&&params.get("grid")==="1";
  histInit();
  const interrupted=pickInterrupted();
  const welcome=()=>interrupted
    ?chip("사진 고르는 동안 화면이 새로 열렸어요. 다른 앱을 닫고 앨범에서 고르기로 다시 해 주세요","warn")
    :chip("예시 방이에요. 우리집 사진을 올려 보세요","");
  const tok=newLoad();
  let room=null;
  try{room=await loadImg("sample/room.jpg");}catch(e){if(tok===S.loadToken)chip("우리집 사진을 올려 보세요","");return;}
  if(tok!==S.loadToken||S.W)return;
  setPhoto(room);S.histId=null;
  try{
    const mask=await loadImg("sample/room-mask.png");
    if(tok!==S.loadToken)return;
    setMask(mask);applyAuto();welcome();
  }catch(e){
    if(tok!==S.loadToken)return;
    await queueDetect(tok);
    if(tok===S.loadToken&&!$("chip").classList.contains("warn"))welcome();
  }
}
window.__sim={S,setMask:src=>{setMask(src);applyAuto();},render,draw,selectProduct,homography,focal,
  cct:{rgb:cctRGB,est:rgbCCT,set:k=>{S.cctSet=k;updateWB();render();}},lens:applyLens,calibrate:()=>{calibrateScale();render();return S.camH;},
  hist:{list:()=>histList.map(m=>({id:m.id,t:m.t,hasMask:m.hasMask,params:m.params})),restore:histRestore,del:histDelete,idle:()=>histQ,detect:()=>detectQ}};
if(params.get("debug")==="1")window.__sim.dbg={ensureModel,floorPrior,floorPriorPipeline,upsample,modelSize};
start();
})();
</script>
